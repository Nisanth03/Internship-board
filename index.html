<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Internship Board</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <div class="container">
            <p class="eyebrow">CAREER OPPORTUNITIES</p>
            <h1>Responsive Internship Board</h1>
            <p class="intro">
                Explore internship opportunities and find a role that matches your skills and interests.
            </p>
        </div>
    </header>

    <main>
        <div class="container">

            <section class="controls" aria-labelledby="search-heading">
                <div class="section-heading">
                    <p class="eyebrow">FIND YOUR ROLE</p>
                    <h2 id="search-heading">Search internships</h2>
                </div>

                <div class="search-box">
                    <label for="search">Search by title, skill, domain or location</label>
                    <input
                        type="search"
                        id="search"
                        name="search"
                        placeholder="Try JavaScript, Pune, Cyber Security..."
                        autocomplete="off"
                    >
                </div>

                <div class="filters">

                    <div class="filter-group">
                        <label for="domain">Domain</label>
                        <select id="domain" name="domain">
                            <option value="all">All domains</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="mode">Work mode</label>
                        <select id="mode" name="mode">
                            <option value="all">All work modes</option>
                        </select>
                    </div>

                </div>
            </section>

            <section class="results" aria-labelledby="results-heading">

                <div class="results-header">
                    <div>
                        <p class="eyebrow">INTERNSHIP LISTINGS</p>
                        <h2 id="results-heading">Available internships</h2>
                    </div>

                    <p id="resultCount" class="result-count" aria-live="polite">
                        Loading internships...
                    </p>
                </div>

                <div id="statusMessage" class="status-message" hidden></div>

                <div
                    id="internshipList"
                    class="internship-list"
                    aria-live="polite"
                ></div>

            </section>

        </div>
    </main>

    <dialog id="detailsDialog">
        <div class="dialog-content">

            <button
                type="button"
                class="dialog-close"
                id="closeDialog"
                aria-label="Close internship details"
            >
                &times;
            </button>

            <div id="dialogContent"></div>

        </div>
    </dialog>

    <script src="data.js"></script>
    <script src="script.js"></script>

</body>
</html>
